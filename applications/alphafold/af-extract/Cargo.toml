[package]
name = "af-extract"
version = "0.1.0"
edition = "2021"
description = "High-performance AlphaFold feature extractor for ET-miner"
authors = ["Et", "C. claudya <claudya@anthropic.local>"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
flate2 = "1"
arrow = { version = "53", features = ["prettyprint"] }
parquet = { version = "53", features = ["arrow"] }
rayon = "1"
dashmap = "6"
indicatif = { version = "0.17", features = ["rayon"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
csv = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
