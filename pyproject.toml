[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "et-miner"
version = "0.1.0"
description = "ET-Miner: Efficient Transaction Miner - a blazing fast Apriori / frequent-itemset miner with a Rust backend and multi-GPU support."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    {name = "E. Ahmic"}
]
keywords = [
    "apriori",
    "association-rules",
    "frequent-itemsets",
    "market-basket-analysis",
    "data-mining",
    "polars",
    "memory-efficient",
    "rust",
    "gpu",
    "cuda",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: Free for non-commercial use",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "joblib>=1.3",
    "loguru>=0.7.3",
    "numpy>=1.20",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "polars>=1.39.0",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
    "scikit-learn>=1.3",
    "scipy>=1.10.0",
    "typer>=0.9",
]

[project.optional-dependencies]
gpu = [
    "cupy-cuda12x>=13.0",
    "nvidia-nccl-cu12>=2.18.1,<3",
    "pyarrow>=15.0",
]
dev = [
    "pytest>=8.0",
    "efficient-apriori>=2.0",
    "matplotlib>=3.7",
    "psutil>=5.9.0",
    "tqdm>=4.60.0",
    "sparse-dot-mkl>=0.9.0",
    "mkl>=2021.1.1",
]

[project.scripts]
et-miner = "et_miner.cli:main"

[project.urls]
Homepage = "https://github.com/Et9797/et-miner"
Repository = "https://github.com/Et9797/et-miner"
Issues = "https://github.com/Et9797/et-miner/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/et_miner"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Project-wide opt-outs, not silenced per edit:
# E402 — module-level imports not at top-of-file. Used for sys.path patches in
#        build scripts and deferred stdlib imports (threading).
# F841 — unused `e` in `except Exception as e:`. Defensive logging pattern where
#        `logger.exception` captures the traceback and the name is reserved for
#        future error-context enrichment.
ignore = ["E402", "F841", "E501"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest-asyncio>=1.3.0",
]
