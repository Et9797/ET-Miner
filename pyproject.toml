[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "et-miner"
version = "0.2.0"
description = "ET-Miner: Efficient Transaction Miner - a blazing fast Apriori / frequent-itemset miner with a Rust backend and multi-GPU support."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    {name = "E. Ahmic"}
]
keywords = [
    "apriori",
    "association-rules",
    "frequent-itemsets",
    "market-basket-analysis",
    "data-mining",
    "polars",
    "memory-efficient",
    "rust",
    "gpu",
    "cuda",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: Free for non-commercial use",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "joblib>=1.3",
    "loguru>=0.7.3",
    "numpy>=1.20",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "polars>=1.39.0",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
    "scikit-learn>=1.3",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
gpu = [
    # [ctk] pulls the CUDA header wheels NVRTC needs at JIT time — kernel
    # compilation then works on runtime/driver-only images, not just devel.
    "cupy-cuda12x[ctk]>=13.0",
    "nvidia-nccl-cu12>=2.18.1,<3",
]
gcs = [
    "google-cloud-storage>=2.14",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    # bench/repro/d63_spec_defect_a_row_split_drop.py counts set bits with
    # np.bitwise_count, which is NumPy 2.0+. Without this floor the standing
    # gate the CHANGELOG calls standing dies on AttributeError under every
    # lowest-direct resolution -- measured py3.10 -> 1.22.4, 3.11 -> 1.23.2,
    # 3.12/3.13 -> 1.26.0, all of them 1.x. The runtime floor deliberately
    # stays at numpy>=1.20: src/ uses nothing 2.0-only and nothing 2.0 removed
    # (both greps clean), so this is the bench surface's requirement, not the
    # library's, and it does not belong in [project].dependencies.
    # uv.lock hid this -- a plain `pip install .[dev]` does not have it.
    "numpy>=2.0",
    "maturin>=1.7",
    "efficient-apriori>=2.0",
    "matplotlib>=3.7",
    "psutil>=5.9.0",
    "tqdm>=4.60.0",
    "sparse-dot-mkl>=0.9.0",
    "mkl>=2021.1.1",
    "mlxtend>=0.23.4",
]

[project.scripts]
et-miner = "et_miner.cli:main"

[project.urls]
Homepage = "https://github.com/Et9797/et-miner"
Repository = "https://github.com/Et9797/et-miner"
Issues = "https://github.com/Et9797/et-miner/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/et_miner"]
# Belt-and-braces: the CUDA sources are package data and must ship.
artifacts = ["src/et_miner/gpu/kernels/_src/*.cu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a physical CUDA device (auto-skipped when none is present)",
    "slow: long-running test (deselect with -m 'not slow')",
    # Applied PER TEST, never to a whole file. A file-wide marker on
    # test_tier_equivalence.py would put the mandated tier chain -- including
    # the Polars, Rust and efficient-apriori tiers, which need no GPU at all --
    # behind a two-device gate, and make it vanish under any
    # -m "not multigpu" selection. That is the same failure as a module-scope
    # importorskip: the gate exits 0 having checked nothing.
    "multigpu: requires two or more CUDA devices (see the note above)",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Pin the rule set explicitly so lint results don't drift when ruff changes
# its own defaults between versions.
select = ["E4", "E7", "E9", "F"]
# Project-wide opt-outs, not silenced per edit:
# F841 — unused `e` in `except Exception as e:`. Defensive logging pattern where
#        `logger.exception` captures the traceback and the name is reserved for
#        future error-context enrichment.
# E501 — line-length is advisory at 120; embedded CUDA sources and log strings
#        may exceed it.
ignore = ["F841", "E501"]

[tool.ruff.lint.per-file-ignores]
# The importorskip-then-import idiom in GPU test modules requires imports
# below module-level statements.
"tests/*" = ["E402"]
