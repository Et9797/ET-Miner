# ET-Miner Rust Extension Build Configuration
#
# Portable by default: no target-cpu pinning, so built extensions run on any
# x86-64/aarch64 machine (needed for CI and distributable wheels).
#
# For a machine-tuned local build (AVX2/AVX-512 SIMD on modern CPUs), opt in
# at build time instead:
#
#     RUSTFLAGS="-C target-cpu=native" maturin develop --release
#
# NOTE: Binaries built with target-cpu=native won't run on older CPUs.

[build]
# rustflags = ["-C", "target-cpu=native"]   # opt-in via RUSTFLAGS (see above)
