# Read the Docs build configuration (v2 schema).
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

python:
  install:
    # Runs `uv sync --group docs`; uv.lock makes it the same pin set as CI and local builds.
    - method: uv
      command: sync
      groups:
        - docs

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
