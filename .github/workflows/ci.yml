name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python environment
        run: uv sync --locked

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_ext -> target

      - name: Build Rust extension
        # Run from inside rust_ext so maturin reads rust_ext/{Cargo,pyproject}.toml
        # — `-m rust_ext/Cargo.toml` from the repo root makes it adopt the ROOT
        # pyproject and clobber the editable et-miner install (verified the hard
        # way). `--project ..` then says which ENVIRONMENT to build into: uv
        # discovers the project by walking up from the cwd, and rust_ext now has
        # a pyproject of its own, so a bare `uv run` would treat it as a separate
        # project, create rust_ext/.venv, and fail to find maturin there. The old
        # spelling worked only because there was no project file to find.
        working-directory: rust_ext
        run: uv run --project .. maturin develop --release

      - name: Ruff
        run: uv run ruff check src tests

      - name: Tests (CPU — includes the tier-equivalence gate vs efficient-apriori)
        run: uv run pytest -q -m "not slow"
