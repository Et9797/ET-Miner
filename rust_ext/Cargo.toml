[package]
name = "et_miner_rust"
version = "0.3.0"
edition = "2021"
description = "High-performance Rust extension for ET-Miner support counting."
license-file = "LICENSE"
authors = ["E. Ahmic <etet1997@hotmail.com>"]

[lib]
name = "et_miner_rust"
crate-type = ["cdylib"]

[dependencies]
# PyO3 for Python bindings (latest for Python 3.14 support)
pyo3 = { version = "0.27", features = ["extension-module"] }

# NumPy integration for zero-copy array access
numpy = "0.27"

# Rayon for work-stealing parallelism
rayon = "1.10"

# Bit vectors for row masks (64 rows per u64 operation)
bitvec = "1.0"

# Portable SIMD for stable Rust
wide = "0.7"

# Random number generation for synthetic data
rand = "0.8"
rand_xoshiro = "0.6"

[dev-dependencies]
# Test-only: lets the #[test] below read the SAME fixture the Python test reads,
# so the min-count rule has one table rather than two that drift.
# Does not affect the shipped cdylib.
serde_json = "1"

[profile.release]
# Maximum optimization for speed
opt-level = 3
lto = "fat"           # Link-time optimization
codegen-units = 1     # Better optimization at cost of compile time
#
# NO `panic = "abort"`. It was here for binary size, and it turned every FFI
# panic into an uncatchable SIGABRT: PyO3's error model depends on unwinding to
# produce a PanicException, and CLAUDE.md's documented build is
# `maturin develop --release`, so the shipped extension always aborted. Five
# ordinary-looking inputs -- a non-contiguous numpy view, n_rows=0, an n_cols
# smaller than the largest column index, an n_rows larger than len(indptr)-1, a
# current_counts length mismatch -- exited 134 with no traceback, losing every
# unflushed level of a long campaign.
#
# It was also never a consistent choice: lib.rs implements a non-contiguous
# copy fallback five times and omits it six times, raises a proper PyValueError
# for an unsorted prev_flat and then aborts one call later for a length
# mismatch, and gpu/mining.py:324-329 wraps a Rust call in a stale-wheel
# recovery path that is dead code under abort.
#
# Unwinding costs some binary size and enables unwind tables. A panic must
# still never cross an `extern "C"` boundary: PyO3 catches at its own boundary,
# and any future CUDA-callback path has to do the same explicitly.

[profile.dev]
# Fast compile times for development
opt-level = 0
debug = true
